# /etc/homelab/backups.conf - THE list of what the Pi backs up.
# Read by /usr/local/sbin/homelab-backup (writes the archives) and by
# /usr/local/bin/homelab-health.sh (checks every set is fresh), so there is
# only one list. Tracked in ~/docker/_host/etc/homelab/backups.conf.
# No secrets in this file (root 644).
#
# One [section] per set. The archive is <base>/<set>/<set>_YYYYmmdd_HHMMSS.tar.gz,
# root:root 0600. The desktop PC (pi-backup-sync) pulls <base> nightly at
# ~06:30 and forwards it to the MacBook over Syncthing, EXCEPT the sets that
# ~/Backups/pi/.stignore on the PC holds back (secrets, adhoc, syncthing, dockge).
#
# Keys (lists are space-separated; paths must not contain spaces):
#   type       sqlite | dir | ha-link | files
#   keep       delete archives older than this many days - but only after
#              THIS run's archive was verified, and never the newest 3
#   max_age_h  homelab-health alerts when the last verified run of this set is
#              older than this (default 48)
#   require    extended regexes; EVERY one must match a member of the archive,
#              or the archive is deleted, the set fails and nothing is pruned
#   forbid     extended regexes; NO member may match (keeps secrets out of
#              sets that travel to the MacBook)
#   sqlite:  db (online .backup with .timeout, then PRAGMA quick_check),
#            count (a table that must have > 0 rows in the copy),
#            files (must exist, copied into the archive root),
#            optional (copied only if present)
#   dir:     root, include (relative to root, must exist), exclude (tar globs)
#   ha-link: source, pattern, min_age_min - hardlinks every finished Home
#            Assistant backup (untouched for min_age_min, not open by any
#            process, tar listing readable) into <base>/<set>. Never copies.
#   files:   paths (globs, missing ones skipped), must (paths that must exist),
#            exclude (tar globs),
#            generate (built-in: git-bundle crontabs packages docker sysinfo),
#            repo + repo_user (for git-bundle)
#
# Restore notes: docs/backups-and-restore.md. Test every set:
#   sudo ~/docker/_host/backup-restore-test.sh

[defaults]
base = /home/pi/backups
# Hand-made snapshots go in <base>/adhoc/<YYYY-MM-DD>-<reason>/ (dir 700,
# files 600). Top-level entries whose ctime is older than this are deleted by
# every full run. Something to keep forever goes in <base>/archive instead.
adhoc_days = 30

# --- AdGuard Home: settings, filters, rewrites, admin hash ------------------
[adguard]
type = dir
keep = 14
root = /home/pi/docker/adguard
include = conf
exclude = conf/AdGuardHome.yaml.bak*
require = ^conf/AdGuardHome\.yaml$

# --- CouchDB: Obsidian LiveSync notes. Append-only files, safe to tar live;
# --- a "file changed as we read it" is retried once after 30 s.
[couchdb]
type = dir
keep = 14
root = /home/pi/docker/couchdb
include = couchdb-data couchdb-etc
require = \.couch$ ^couchdb-etc/

# --- Uptime Kuma: monitors, the ntfy notification, history -----------------
[kuma]
type = sqlite
keep = 7
db = /home/pi/docker/uptime-kuma/data/kuma.db
count = monitor
require = ^\./kuma\.db$

# --- Vaultwarden. rsa_key.pem is REQUIRED: without it every Bitwarden client
# --- is logged out after a restore (it signs the login tokens). Its .env
# --- (ADMIN_TOKEN) is in the secrets set.
[vaultwarden]
type = sqlite
keep = 14
db = /home/pi/docker/vaultwarden/data/db.sqlite3
count = ciphers
files = /home/pi/docker/vaultwarden/data/rsa_key.pem
optional = /home/pi/docker/vaultwarden/data/config.json /home/pi/docker/vaultwarden/data/attachments /home/pi/docker/vaultwarden/data/sends
require = ^\./db\.sqlite3$ ^\./rsa_key\.pem$

# --- Dockge: its admin user and JWT secret. It controls docker.sock, so this
# --- set is held back from the MacBook like the secrets set.
[dockge]
type = sqlite
keep = 14
db = /home/pi/docker/dockge/data/dockge.db
count = user
optional = /home/pi/docker/dockge/data/db-config.json
require = ^\./dockge\.db$

# --- Syncthing identity: device key/cert, config.xml (folders, devices, GUI
# --- API key). The live index and the lock file are left out: a restore
# --- rebuilds the index by rescanning. Held back from the MacBook.
[syncthing]
type = dir
keep = 14
root = /home/pi/docker/syncthing
include = config
exclude = config/index-* config/syncthing.lock
require = ^config/key\.pem$ ^config/cert\.pem$ ^config/config\.xml$
forbid = index-v2 syncthing\.lock

# --- Home Assistant makes its own encrypted backups (random time ~04:45-05:50,
# --- keeps 3). Hardlink every finished one so they outlive HA's rotation.
# --- The encryption key is in the secrets set (.storage/backup).
[homeassistant]
type = ha-link
keep = 7
source = /home/pi/docker/homeassistant/config/backups
pattern = *.tar
min_age_min = 10
require = backup\.json$ homeassistant\.tar
# HA runs at a random time, so at 05:00 the newest finished one is usually
# ~24 h old; fail only when a whole day's HA backup is missing.
max_age_h = 50

# --- Everything needed to rebuild the box around the data sets. No secrets:
# --- the git history is checked by the pre-commit hook.
[platform]
type = files
keep = 30
repo = /home/pi/docker
repo_user = pi
generate = git-bundle crontabs packages docker sysinfo
must = /etc/homelab/backups.conf /etc/fstab /boot/firmware/cmdline.txt /boot/firmware/config.txt
paths = /etc/homelab/backups.conf
# whole dirs since 2026-10-21 (the old name globs missed tv-mood, hyperhdr, eth-ring,
# zram, caretaker... and which units are enabled); ~400 KB, no secret values inside
paths = /etc/systemd/system
paths = /usr/local/bin /usr/local/sbin
paths = /etc/tmpfiles.d/homelab.conf /etc/systemd/journald.conf.d /etc/systemd/system.conf.d /etc/docker/daemon.json
paths = /etc/ufw/*.rules /etc/ufw/ufw.conf /etc/default/ufw /etc/fail2ban/jail.local /etc/fail2ban/jail.d
paths = /etc/fstab /boot/firmware/config.txt /boot/firmware/cmdline.txt /etc/hostname /etc/hosts
paths = /etc/systemd/network /etc/systemd/resolved.conf /etc/systemd/resolved.conf.d /etc/NetworkManager/NetworkManager.conf /etc/NetworkManager/conf.d
paths = /etc/ssh/sshd_config /etc/ssh/sshd_config.d /etc/sudoers.d /etc/sysctl.d
paths = /etc/apt/sources.list /etc/apt/sources.list.d /etc/apt/apt.conf.d/20auto-upgrades /etc/apt/apt.conf.d/50unattended-upgrades
require = ^generated/docker\.bundle$ ^generated/crontab-root\.txt$ ^generated/dpkg-selections\.txt$ ^generated/docker-images\.txt$ ^etc/homelab/backups\.conf$ ^etc/fstab$
forbid = (^|/)\.env$ secrets\.env$ system-connections

# --- SECRETS: every stack .env, /etc/homelab/secrets.env, the HA backup
# --- encryption key, the user-level ntfy topic file, NetworkManager connection
# --- secrets. On the Pi and the PC (LUKS) only - held back from the MacBook by
# --- the PC's .stignore and refused by homelab-backup-push-mac.
[secrets]
type = files
keep = 14
must = /etc/homelab/secrets.env /home/pi/docker/vaultwarden/.env
paths = /etc/homelab/secrets.env /home/pi/docker/*/.env
paths = /home/pi/docker/homeassistant/config/.storage/backup
paths = /home/pi/.ntfy-topic
paths = /etc/NetworkManager/system-connections
require = ^etc/homelab/secrets\.env$ ^home/pi/docker/vaultwarden/\.env$
