# 2026-10-20: HyperHDR leaks memory per client connection; it reached 2.6 GB and starved the Pi
# (DNS slow for the whole house). Memory limits need the memory cgroup, which Pi OS switches off
# (cgroup_disable=memory, changing it needs a boot edit + reboot), so hyperhdr-guard.timer
# restarts it past 300 MB instead. Here: low CPU/IO weight, house services always come first.
[Service]
Restart=always
Nice=10
CPUWeight=20
IOWeight=20
