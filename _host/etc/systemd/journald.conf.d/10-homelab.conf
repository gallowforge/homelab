# homelab: keep the journal on disk so watchdog/backup/kernel evidence survives
# reboots and power cuts. Overrides Storage=volatile in /etc/systemd/journald.conf.
# Enabled 2026-09-17 after the ufw IPv6-multicast log spam was silenced.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=2G
MaxRetentionSec=30day
