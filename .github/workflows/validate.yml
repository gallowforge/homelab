# Proves the repo is sane on every push and pull request. Nothing here touches
# a live system: syntax checks, a config parse, the stubbed test suite and a
# secret scan. Every step runs the same way on a workstation; see README.md,
# "Validation of this copy".
name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just the tip

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --quiet pyyaml
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | sed -n 2p
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Scripts are found by shebang, not extension: most host scripts have none.
      - name: Find scripts
        run: |
          : > "$RUNNER_TEMP/shell.txt"; : > "$RUNNER_TEMP/python.txt"
          git ls-files -z | while IFS= read -r -d '' f; do
            first=$(head -n 1 -- "$f")
            case "$first" in
              '#!'*bash*|'#!'*/sh|'#!'*' sh') echo "$f" >> "$RUNNER_TEMP/shell.txt" ;;
              '#!'*python*) echo "$f" >> "$RUNNER_TEMP/python.txt" ;;
              *) case "$f" in *.py) echo "$f" >> "$RUNNER_TEMP/python.txt" ;; esac ;;
            esac
          done
          echo "shell scripts: $(wc -l < "$RUNNER_TEMP/shell.txt")"
          echo "python files:  $(wc -l < "$RUNNER_TEMP/python.txt")"
          test -s "$RUNNER_TEMP/shell.txt" && test -s "$RUNNER_TEMP/python.txt"

      - name: bash -n
        if: ${{ !cancelled() }}
        run: |
          rc=0
          while IFS= read -r f; do bash -n "$f" || { echo "::error file=$f::bash -n failed"; rc=1; }; done < "$RUNNER_TEMP/shell.txt"
          exit $rc

      - name: shellcheck (severity error)
        if: ${{ !cancelled() }}
        run: xargs -d '\n' -a "$RUNNER_TEMP/shell.txt" shellcheck --severity=error

      - name: py_compile
        if: ${{ !cancelled() }}
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: xargs -d '\n' -a "$RUNNER_TEMP/python.txt" python -m py_compile

      # Home Assistant uses its own tags (!include, !secret). They are accepted
      # as opaque values so the parse checks structure, not HA semantics.
      - name: YAML parse
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import subprocess, sys, yaml

          class Loader(yaml.SafeLoader):
              pass

          Loader.add_multi_constructor("!", lambda loader, suffix, node: None)
          files = subprocess.run(["git", "ls-files", "*.yml", "*.yaml"],
                                 capture_output=True, text=True, check=True).stdout.split()
          bad = 0
          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      list(yaml.load_all(fh, Loader=Loader))
              except yaml.YAMLError as e:
                  print(f"::error file={f}::{e}")
                  bad += 1
          print(f"{len(files)} YAML files parsed, {bad} failed")
          sys.exit(1 if bad or not files else 0)

      - name: Backup list
        if: ${{ !cancelled() }}
        run: HOMELAB_BACKUP_CONF=_host/etc/homelab/backups.conf bash _host/usr/local/sbin/homelab-backup --check-config

      - name: Stubbed tests (notifier, netprobe)
        if: ${{ !cancelled() }}
        run: |
          d="$RUNNER_TEMP/wdtest"
          mkdir -p "$d/bin"
          cp _host/watchdog-tests.sh "$d/run-tests.sh"
          cp _host/usr/local/bin/*.sh _host/usr/local/bin/homelab-netprobe "$d/bin/"
          TEST_TMP="$d/tmp" bash "$d/run-tests.sh"

      - name: gitleaks
        if: ${{ !cancelled() }}
        run: gitleaks git --redact --no-banner --exit-code 1 .
