# Routines exposed to a phone's shortcuts (through the webhook in configuration.yaml), plus
# the helpers they share. Shortcuts call these instead of Apple Home device ids, so they
# survive HomeKit changes. A few illustrative routines are shown; more follow the same shape.
# Steps that drive cloud-only devices (a ceiling LED through a SwitchBot infrared hub, a Tuya
# ceiling dimmer) carry continue_on_error, so one offline device never stops the rest of a
# routine (a hub once dropped off the SwitchBot cloud and two routines stopped before their
# Hue scene and TV mode).
lights_up:
  alias: Lights up
  icon: mdi:white-balance-sunny
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: light.turn_off
      target: {entity_id: light.ceiling_led}
      continue_on_error: true
    - action: light.turn_on
      target: {entity_id: light.ceiling_dimmer}
      continue_on_error: true
      data: {brightness_pct: 100}
    - action: scene.turn_on
      target: {entity_id: scene.living_room_daylight}
    - action: script.turn_on
      target: {entity_id: script.tv_picture_mode}
      data: {variables: {mode: "Standard"}}
movie_time:
  alias: Movie time
  icon: mdi:movie-open
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: light.turn_off
      target: {entity_id: light.ceiling_dimmer}
      continue_on_error: true
    - action: scene.turn_on
      target: {entity_id: scene.living_room_movie}
    - action: script.turn_on
      target: {entity_id: script.tv_picture_mode}
      data: {variables: {mode: "Movie"}}
cinema:
  alias: Cinema
  icon: mdi:filmstrip
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: light.turn_off
      target: {entity_id: [light.ceiling_led, light.ceiling_dimmer]}
      continue_on_error: true
    - action: scene.turn_on
      target: {entity_id: scene.living_room_cinematic}
    - action: script.turn_on
      target: {entity_id: script.tv_picture_mode}
      data: {variables: {mode: "FILMMAKER MODE"}}
# A mood routine: a Hue scene from ../hue/scenes.py, ceiling lights to match, and the TV
# picture mode by lighting level (bright = Standard, dim = Movie, darkest = FILMMAKER MODE).
golden_hour:
  alias: Golden Hour
  icon: mdi:weather-sunset
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: light.turn_off
      target: {entity_id: [light.ceiling_led, light.ceiling_dimmer]}
      continue_on_error: true
    - action: scene.turn_on
      target: {entity_id: scene.living_room_golden_hour}
      data: {transition: 2}
    - action: script.turn_on
      target: {entity_id: script.tv_picture_mode}
      data: {variables: {mode: "Standard"}}
all_off:
  alias: All off
  icon: mdi:power
  sequence:
    - action: script.hue_sync
      data: {state: false}
    # TV first, and wait (max 20 s) until it reports off before the lights change.
    # Only when the TV is on: the TV's "off" is a power-key press, and on a TV that is already
    # off it switches the TV ON.
    - if:
        - condition: state
          entity_id: media_player.tv
          state: "on"
      then:
        - action: media_player.turn_off
          target: {entity_id: media_player.tv}
          continue_on_error: true
        - wait_template: "{{ is_state('media_player.tv', 'off') }}"
          timeout: "00:00:20"
          continue_on_timeout: true
    - action: light.turn_off
      target: {entity_id: [light.ceiling_led, light.ceiling_dimmer, light.living_room]}
      continue_on_error: true
tv_picture_mode:
  alias: TV Picture Mode
  icon: mdi:television-ambient-light
  description: Remember the picture mode for the room and set it now if the TV is on.
  mode: restart
  fields:
    mode: {description: "Standard, Movie or FILMMAKER MODE", example: Movie}
  sequence:
    - action: input_select.select_option
      target: {entity_id: input_select.tv_picture_mode}
      data: {option: "{{ mode }}"}
    - condition: state
      entity_id: media_player.tv
      state: "on"
    # A poll makes HA refresh the SmartThings token if it is old, before the script borrows it.
    - action: homeassistant.update_entity
      target: {entity_id: media_player.tv_smartthings}
      continue_on_error: true
    - delay: 2
    - repeat:
        sequence:
          - action: shell_command.tv_picture_mode
            data: {mode: "{{ mode }}"}
            response_variable: r
            continue_on_error: true
          # returncode 3 = SmartThings token expired/refused: reloading the integration renews it.
          - if: "{{ r is defined and r.returncode == 3 }}"
            then:
              - action: homeassistant.reload_config_entry
                data: {entry_id: "{{ config_entry_id('media_player.tv_smartthings') }}"}
                continue_on_error: true
              - delay: 15
          - if: "{{ r is not defined or r.returncode not in [0, 3] }}"
            then: [{delay: 10}]
        until: "{{ (r is defined and r.returncode == 0) or repeat.index >= 3 }}"

# Hue screen sync (TV -> tv-mood -> HyperHDR on this Pi). Lighting routines above switch it off so
# their scene sticks and stays; only "Sync lights" switches it on.
hue_sync:
  alias: Hue screen sync
  icon: mdi:monitor-shimmer
  mode: queued
  fields:
    state: {description: "true = lamps follow the screen, false = pause", example: false}
  sequence:
    - action: rest_command.hue_sync
      data: {state: "{{ 'true' if state else 'false' }}"}
      continue_on_error: true
      response_variable: r
    # HyperHDR puts the lamps back as they were when it lets go; wait so a scene lands after.
    - if: "{{ not state and r is defined and r.status == 200 }}"
      then: [{delay: 1.5}]
sync_lights:
  alias: Sync lights
  icon: mdi:monitor-shimmer
  sequence:
    - action: light.turn_off
      target: {entity_id: [light.ceiling_led, light.ceiling_dimmer]}
      continue_on_error: true
    - action: script.hue_sync
      data: {state: true}
stop_syncing:
  alias: Stop syncing
  icon: mdi:monitor-off
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: scene.turn_on
      target: {entity_id: scene.living_room_cozy}
      data: {transition: 2}
