# Hue screen sync (TV -> tv-mood -> HyperHDR on this Pi). Lighting routines above switch it off so
# their scene sticks and stays; only "Sync lights" switches it on (owner, 2026-10-21).
hue_sync:
  alias: Hue screen sync
  icon: mdi:monitor-shimmer
  mode: queued
  fields:
    state: {description: "true = lamps follow the PC screen, false = pause", example: false}
  sequence:
    - action: rest_command.hue_sync
      data: {state: "{{ 'true' if state else 'false' }}"}
      continue_on_error: true
      response_variable: r
    # HyperHDR puts the lamps back as they were when it lets go; wait so a scene lands after.
    - if: "{{ not state and r is defined and r.status == 200 }}"
      then: [{delay: 1.5}]
sync_lights:
  alias: Sync lights
  icon: mdi:monitor-shimmer
  sequence:
    - action: light.turn_off
      target: {entity_id: [light.ceiling_led, light.ceiling_dimmer]}
      continue_on_error: true
    - action: script.hue_sync
      data: {state: true}
stop_syncing:
  alias: Stop syncing
  icon: mdi:monitor-off
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: scene.turn_on
      target: {entity_id: scene.bedroom_cozy}
      data: {transition: 2}

# PC couch/desk mode (added 2026-10-18). shell_command.pc_remote -> pc-remote on the PC.
# Couch mode wakes the PC if needed and waits for its desktop (up to about 2 minutes).
couch_mode:
  alias: Couch mode
  icon: mdi:sofa
  mode: single
  sequence:
    - if:
        - condition: state
          entity_id: switch.desktop_pc
          state: "off"
      then:
        - action: switch.turn_on
          target: {entity_id: switch.desktop_pc}
    - repeat:
        sequence:
          - action: shell_command.pc_remote
            data: {action: couch}
            response_variable: r
            continue_on_error: true
          - if: "{{ r is not defined or r.returncode != 0 }}"
            then: [{delay: 8}]
        until: "{{ (r is defined and r.returncode == 0) or repeat.index >= 15 }}"
desk_mode:
  alias: Desk mode
  icon: mdi:monitor
  sequence:
    - condition: state
      entity_id: switch.desktop_pc
      state: "on"
    - action: shell_command.pc_remote
      data: {action: desk}
big_picture_on:
  alias: Big Picture on
  icon: mdi:steam
  sequence:
    - condition: state
      entity_id: switch.desktop_pc
      state: "on"
    - action: shell_command.pc_remote
      data: {action: bigpicture-on}
big_picture_off:
  alias: Big Picture off
  icon: mdi:steam
  sequence:
    - condition: state
      entity_id: switch.desktop_pc
      state: "on"
    - action: shell_command.pc_remote
      data: {action: bigpicture-off}
