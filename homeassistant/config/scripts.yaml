# The owner's 9 home routines (rebuilt 2026-10-16 from his Apple Shortcuts, captured exactly).
# iPhone Shortcuts call these instead of Apple Home device ids, so they survive HomeKit changes.
# The SwitchBot-app part of Movie time / Make it cozy (IR ceiling LED orange + brighter) stays
# in the Shortcut itself ("Switchbot Cozy Ceiling Mode"); HA can only switch that LED on/off.
# Steps that drive the cloud-only devices (ceiling LED and AC = SwitchBot infrared through
# the Bedroom Hub Mini; ceiling dimmer and air filter = Tuya) carry continue_on_error, so one
# offline device never stops the rest of a routine (2026-10-29: the Bedroom hub dropped off the
# SwitchBot cloud and Pure Cinema / Game On stopped before their Hue scene and TV mode).
let_there_be_light:
  alias: Let there be light
  icon: mdi:white-balance-sunny
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: light.turn_off
      target: {entity_id: light.ceiling_led}
      continue_on_error: true
    - action: light.turn_on
      target: {entity_id: light.ceiling_dimmer}
      continue_on_error: true
      data: {brightness_pct: 100}
    - action: scene.turn_on
      target: {entity_id: scene.bedroom_daylight}
    - action: script.turn_on
      target: {entity_id: script.tv_picture_mode}
      data: {variables: {mode: "Standard"}}
movie_time:
  alias: Movie time
  icon: mdi:movie-open
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: light.turn_off
      target: {entity_id: light.ceiling_dimmer}
      continue_on_error: true
    - action: scene.turn_on
      target: {entity_id: scene.bedroom_movie}
    - action: script.turn_on
      target: {entity_id: script.tv_picture_mode}
      data: {variables: {mode: "Movie"}}
make_it_cozy:
  alias: Make it cozy
  icon: mdi:candle
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: light.turn_on
      target: {entity_id: light.ceiling_dimmer}
      continue_on_error: true
      data: {brightness_pct: 10}
    - action: scene.turn_on
      target: {entity_id: scene.bedroom_cozy}
    - action: script.turn_on
      target: {entity_id: script.tv_picture_mode}
      data: {variables: {mode: "Standard"}}
make_it_cinematic:
  alias: Make it Cinematic
  icon: mdi:filmstrip
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: light.turn_off
      target: {entity_id: [light.ceiling_led, light.ceiling_dimmer]}
      continue_on_error: true
    - action: scene.turn_on
      target: {entity_id: scene.bedroom_dimmed_2}
    - action: script.turn_on
      target: {entity_id: script.tv_picture_mode}
      data: {variables: {mode: "FILMMAKER MODE"}}
i_need_some_air:
  alias: I Need Some Air
  icon: mdi:weather-windy
  sequence:
    - action: switch.turn_on
      target: {entity_id: [switch.air_filter, switch.ac_cool]}
      continue_on_error: true
i_need_some_silence:
  alias: I Need Some Silence
  icon: mdi:volume-off
  sequence:
    - action: switch.turn_off
      target: {entity_id: [switch.air_filter, switch.ac_cool]}
      continue_on_error: true
im_home:
  alias: I'm Home
  icon: mdi:home-import-outline
  sequence:
    - action: script.hue_sync
      data: {state: false}
    - action: scene.turn_on
      target: {entity_id: scene.bedroom_daylight}
    - action: switch.turn_on
      target: {entity_id: [switch.air_filter, switch.ac_cool]}
      continue_on_error: true
    - action: light.turn_on
      target: {entity_id: light.ceiling_dimmer}
      continue_on_error: true
      data: {brightness_pct: 100}
    - action: script.turn_on
      target: {entity_id: script.tv_picture_mode}
      data: {variables: {mode: "Standard"}}
leaving_home:
  alias: Leaving Home
  icon: mdi:home-export-outline
  sequence:
    - action: script.hue_sync
      data: {state: false}
    # Added 2026-10-18: the Hue lamps and the TV used to stay on after leaving.
    # TV first, and wait (max 20 s) until it reports off before the lights change.
    # Only when the TV is on: the Samsung "off" is a power-key press, and on a TV that is already
    # off it switches the TV ON (Off To Bed did exactly that at 04:57).
    - if:
        - condition: state
          entity_id: media_player.samsung_tv
          state: "on"
      then:
        - action: media_player.turn_off
          target: {entity_id: media_player.samsung_tv}
          continue_on_error: true
        - wait_template: "{{ is_state('media_player.samsung_tv', 'off') }}"
          timeout: "00:00:20"
          continue_on_timeout: true
    - action: switch.turn_off
      target: {entity_id: [switch.ac_cool, switch.air_filter]}
      continue_on_error: true
    - action: light.turn_off
      target: {entity_id: [light.ceiling_led, light.ceiling_dimmer, light.bedroom]}
      continue_on_error: true
off_to_bed:
  alias: Off To Bed
  icon: mdi:bed
  sequence:
    - action: script.hue_sync
      data: {state: false}
    # Added 2026-10-18: the TV goes off too (the PC is left alone; it may hold running work).
    # TV first, and wait (max 20 s) until it reports off before the lights change.
    # Only when the TV is on: the Samsung "off" is a power-key press, and on a TV that is already
    # off it switches the TV ON (Off To Bed did exactly that at 04:57).
    - if:
        - condition: state
          entity_id: media_player.samsung_tv
          state: "on"
      then:
        - action: media_player.turn_off
          target: {entity_id: media_player.samsung_tv}
          continue_on_error: true
        - wait_template: "{{ is_state('media_player.samsung_tv', 'off') }}"
          timeout: "00:00:20"
          continue_on_timeout: true
    - action: light.turn_off
      target: {entity_id: [light.ceiling_led, light.ceiling_dimmer]}
      continue_on_error: true
    - action: scene.turn_on
      target: {entity_id: scene.bedroom_night_light}
    - action: switch.turn_on
      target: {entity_id: [switch.air_filter, switch.ac_cool]}
      continue_on_error: true
tv_picture_mode:
  alias: TV Picture Mode
  icon: mdi:television-ambient-light
  description: Remember the picture mode for the room and set it now if the TV is on.
  mode: restart
  fields:
    mode: {description: "Standard, Movie or FILMMAKER MODE", example: Movie}
  sequence:
    - action: input_select.select_option
      target: {entity_id: input_select.tv_picture_mode}
      data: {option: "{{ mode }}"}
    - condition: state
      entity_id: media_player.samsung_tv
      state: "on"
    # A poll makes HA refresh the SmartThings token if it is old, before the script borrows it.
    - action: homeassistant.update_entity
      target: {entity_id: media_player.samsung_tv_smartthings}
      continue_on_error: true
    - delay: 2
    - repeat:
        sequence:
          - action: shell_command.tv_picture_mode
            data: {mode: "{{ mode }}"}
            response_variable: r
            continue_on_error: true
          # returncode 3 = SmartThings token expired/refused: reloading the integration renews it.
          - if: "{{ r is defined and r.returncode == 3 }}"
            then:
              - action: homeassistant.reload_config_entry
                data: {entry_id: "{{ config_entry_id('media_player.samsung_tv_smartthings') }}"}
                continue_on_error: true
              - delay: 15
          - if: "{{ r is not defined or r.returncode not in [0, 3] }}"
            then: [{delay: 10}]
        until: "{{ (r is defined and r.returncode == 0) or repeat.index >= 3 }}"

