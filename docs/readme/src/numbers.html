<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>homelab: plant status</title>
<link rel="stylesheet" href="board.css">
<style>
  .panel { padding-bottom: 28px; }
  .rail { margin-bottom: 26px; }
  .meters { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .m { display: flex; flex-direction: column; }
  .win {
    position: relative; height: 92px; display: flex; align-items: center; justify-content: flex-end; gap: 6px;
    padding: 0 14px 0 12px; border-radius: 3px; background: linear-gradient(180deg, #03080d, #071019);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.9), inset 0 0 0 1px rgba(0,0,0,.8), 0 0 0 4px #1a2c3e, 0 0 0 5px #070f17, 0 1px 0 5px rgba(255,255,255,.05);
  }
  .win::after { /* glass glare */
    content: ""; position: absolute; inset: 0; border-radius: 3px; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 38%);
  }
  .win .u { align-self: flex-end; margin-bottom: 18px; font: 600 10px/1 var(--disp); font-stretch: 125%; letter-spacing: .14em; color: var(--engrave-3); }
  .m h3 { margin-top: 18px; display: flex; align-items: center; gap: 9px; font: 650 12.5px/1.25 var(--disp); font-stretch: 125%; letter-spacing: .14em; text-transform: uppercase; color: var(--engrave); white-space: nowrap; }
  .m p { margin-top: 6px; font: 400 10.5px/1.45 var(--mono); font-stretch: 87.5%; color: var(--engrave-3); }
  .m.clear h3 { color: var(--green); }
  @media (max-width: 700px) {
    .meters { grid-template-columns: 1fr 1fr; gap: 26px 22px; }
    .win { height: 88px; }
    .m h3 { margin-top: 16px; font-size: 12px; }
    .m p { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="panel">
  <div class="rail">
    <span class="bno">B0</span>
    <span class="rtitle">Plant status</span>
    <span class="rnote">figures from the live Pi</span>
  </div>
  <div class="meters" id="meters"></div>
</div>
<script src="common.js"></script>
<script>
  const rows = [
    ["15", "", "Services", "containers on one Pi 5"],
    ["12", "", "Backup sets", "verified every night"],
    ["10", "sec", "Restore drill", "weekly, all in RAM"],
    ["77", "", "Alert checks", "conditions, every day"],
    ["20", "", "Timers", "systemd, 0 cron jobs"],
    ["0", "", "Port forwards", "nothing exposed", true],
  ];
  const h = mobile() ? 52 : 54;
  document.getElementById("meters").innerHTML = rows.map(([v, u, t, c, clear]) =>
    `<div class="m${clear ? " clear" : ""}"><div class="win">${seg(v.padStart(2, " "), { h, color: clear ? "#52d68a" : "#f5a63c" })}${u ? `<span class="u">${u}</span>` : ""}</div>` +
    `<h3>${clear ? '<i class="lamp"></i>' : ""}${t}</h3><p>${c}</p></div>`).join("");
</script>
</body>
</html>
